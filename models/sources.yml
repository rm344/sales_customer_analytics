sources:
  - name: bronze
    database: ct_rajat_mahore_db
    schema: bronze
    config:
          loaded_at_field: updated_at
          freshness:
                warn_after: {count: 24, period: hour}
                error_after: {count: 48, period: hour}
 
    tables:
      - name: ext_customers
      - name: ext_employees
      - name: ext_orders
      - name: ext_products
        config:
          loaded_at_field: updated_at
          freshness:
                warn_after: {count: 1, period: day}
                error_after: {count: 2, period: day}
      - name: ext_stores