version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_key
        tests:
          - unique
          - not_null
      - name: age_segment
        tests:
          - accepted_values:
              arguments:
                values: ['Young', 'Middle-aged', 'Senior', 'Unknown']

  - name: dim_product
    columns:
      - name: product_key
        tests:
          - unique
          - not_null
      - name: product_id
        tests:
          - unique
          - not_null

  - name: dim_employee
    columns:
      - name: employee_key
        tests:
          - unique
          - not_null
      - name: employee_id
        tests:
          - unique
          - not_null

  - name: dim_store
    columns:
      - name: store_key
        tests:
          - unique
          - not_null
      - name: store_id
        tests:
          - unique
          - not_null
      - name: size_category
        tests:
          - accepted_values:
              arguments:
                values: ['Small', 'Medium', 'Large']

  - name: dim_date
    columns:
      - name: date_key
        tests:
          - unique
          - not_null
      - name: full_date
        tests:
          - unique
          - not_null
      - name: season
        tests:
          - accepted_values:
              arguments:
                values: ['Winter', 'Spring', 'Summer', 'Fall']

  - name: fact_sales
    columns:
      - name: sales_key
        tests:
          - unique
          - not_null

      - name: customer_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key

      - name: product_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

      - name: store_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_key

      - name: date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: employee_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_employee')
                field: employee_key

      - name: sales_channel
        tests:
          - accepted_values:
              arguments:
                values: ['Online', 'In-Store']