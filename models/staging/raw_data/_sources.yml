version: 2

sources:
  - name: raw_data
    database: CT_RAJAT_MAHORE_DB
    schema: azure_raw_data
    
    config:
      loaded_at_field: "VALUE:updated_at::timestamp"
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 48, period: hour}

    tables:
      - name: ext_customer
      - name: ext_employee
      - name: ext_orders
      - name: ext_store   
      - name: ext_products
        config:
          loaded_at_field: "VALUE:updated_at::timestamp"     
          freshness:
            warn_after: {count: 8, period: day}
            error_after: {count: 12, period: day}